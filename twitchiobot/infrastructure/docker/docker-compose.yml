services:
  # Local one-shot EventSub survey. Production uses EventBridge Scheduler/ECS.
  collector:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.collector
    container_name: vieweratlas-collector
    environment:
      - TWITCH_OAUTH_TOKEN=${TWITCH_OAUTH_TOKEN}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_BOT_USER_ID=${TWITCH_BOT_USER_ID}
      - TWITCH_REFRESH_TOKEN=${TWITCH_REFRESH_TOKEN}
      - STORAGE_TYPE=${STORAGE_TYPE:-file}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX:-vieweratlas/}
      - S3_REGION=${S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - LOG_LEVEL=INFO
    volumes:
      - ../../logs:/app/logs
    restart: "no"
    networks:
      - vieweratlas

  # Analysis Pipeline Service
  analysis:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.analysis
    container_name: vieweratlas-analysis
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-file}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX:-vieweratlas/}
      - S3_REGION=${S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - LOG_LEVEL=INFO
    volumes:
      - ../../logs:/app/logs
      - ../../community_analysis:/app/community_analysis
    networks:
      - vieweratlas

networks:
  vieweratlas:
    driver: bridge
