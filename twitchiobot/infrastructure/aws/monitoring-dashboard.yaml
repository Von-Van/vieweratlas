# ViewerAtlas scheduled-survey monitoring. apply-monitoring.sh turns this into
# a CloudWatch dashboard; alarms are applied directly by that script.

dashboard_config:
  name: "ViewerAtlas-Surveys"
  widgets:
    - type: "metric"
      title: "Scheduled survey outcomes"
      metrics:
        - name: "SurveyStartedCount"
          namespace: "ViewerAtlas/Collector"
          stat: "Sum"
          period: 28800
        - name: "SurveyTerminalCount"
          namespace: "ViewerAtlas/Collector"
          stat: "Sum"
          period: 28800
        - name: "SurveyPartialCount"
          namespace: "ViewerAtlas/Collector"
          stat: "Sum"
          period: 28800

    - type: "metric"
      title: "Collector errors"
      metrics:
        - name: "CollectorErrorCount"
          namespace: "ViewerAtlas/Collector"
          stat: "Sum"
          period: 300

    - type: "metric"
      title: "Daily analysis outcomes"
      metrics:
        - name: "AnalysisCompletedCount"
          namespace: "ViewerAtlas/Analysis"
          stat: "Sum"
          period: 21600
        - name: "AnalysisFailedCount"
          namespace: "ViewerAtlas/Analysis"
          stat: "Sum"
          period: 21600

    - type: "log"
      title: "Survey milestones (no viewer identities)"
      log_group: "/ecs/vieweratlas-collector"
      query: |
        fields @timestamp, @message
        | filter @message like /SURVEY_/ or @message like /BATCH_COMPLETED/
        | sort @timestamp desc
        | limit 100

    - type: "log"
      title: "Recent collector errors"
      log_group: "/ecs/vieweratlas-collector"
      query: |
        fields @timestamp, @message
        | filter @message like /ERROR/ or @message like /Traceback/
        | sort @timestamp desc
        | limit 100

    - type: "log"
      title: "Daily analysis milestones and failures"
      log_group: "/ecs/vieweratlas-analysis"
      query: |
        fields @timestamp, @message
        | filter @message like /ANALYSIS_COMPLETED/ or @message like /ANALYSIS_FAILED/
        | sort @timestamp desc
        | limit 50
